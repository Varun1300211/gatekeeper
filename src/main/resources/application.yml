spring:
  application:
    name: GateKeeper
  profiles:
    default: h2
  cache:
    cache-names: gatekeeperEvaluations
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}

gatekeeper:
  cors:
    allowed-origin-patterns:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://*.netlify.app
      - https://*.vercel.app
  rate-limit:
    evaluate:
      enabled: true
      requests-per-minute: 60
  messaging:
    config-events:
      enabled: true
      stream-key: gatekeeper:config-events
      topic: ${KAFKA_CONFIG_EVENTS_TOPIC:gatekeeper.config-events}
      consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:gatekeeper-sdk-simulator}
      poll-interval-ms: 2000
      max-read-count: 20
  sdk:
    base-url: http://localhost:8080
    local-cache-ttl-seconds: 30
    poll-interval-seconds: 15
