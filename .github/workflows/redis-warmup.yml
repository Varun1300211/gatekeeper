name: Redis Warmup

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  warmup:
    name: Warm Evaluation Cache
    runs-on: ubuntu-latest

    steps:
      - name: Wake backend
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --retry-delay 20 \
            --max-time 120 \
            "${{ secrets.GATEKEEPER_BACKEND_URL }}/healthz"

      - name: Warm Redis-backed evaluation path
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --retry-delay 20 \
            --max-time 120 \
            --user "${{ secrets.GATEKEEPER_VIEWER_USERNAME }}:${{ secrets.GATEKEEPER_VIEWER_PASSWORD }}" \
            "${{ secrets.GATEKEEPER_BACKEND_URL }}/api/evaluate?flagKey=redis-warmup&userId=github-actions&environment=prod"
